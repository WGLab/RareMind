# ============================================================
# RareMind default configuration
# ============================================================
# All pipeline behavior is controlled from this file. The pipeline
# is designed so that you can switch the frontier consultation between
# local LLM (free, for testing) and a cloud API (for production) with
# a single config change: frontier.provider.
# ============================================================

project:
  name: "raremind"
  outputs_dir: "outputs"
  dataset: "demo"

paths:
  # Path to the harmonized Mondo/OMIM/Orphanet/GeneReviews KG.
  # This is the large JSON you built. Adjust to your actual path.
  kg_path: "data/knowledge_graph/Mondo_diseases_KG_combined.json"

  # Full Mondo term dump for disease normalization.
  full_mondo: "data/knowledge_graph/complete_structured_mondo_kg.json"

  # Disease ID cross-mapping files.
  omim2path: "data/mondo/omim_conversion.json"
  orphanet2path: "data/mondo/orphanet_conversion.json"

  # Disease group hierarchy file.
  hierarchy: "data/mondo/hierarchy.json"

  # HPO ontology OBO file (downloaded by scripts/00_download_hpo.py).
  hpo_obo: "data/hpo/hp.obo"

  # Index / cache directories.
  index_dir: "data/indexes"
  cache_dir: "data/cache"

# ============================================================
# Models (Stage 1, 5, 6, 8)
# ============================================================
models:
  text_llm:
    model_name: "google/medgemma-27b-it" #"Qwen/Qwen3-8B"
    temperature: 0.2
    max_tokens: 10000
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.85
    max_batch_size: 64
    thinking: false

  vision_llm:
    model_name: "Qwen/Qwen3.5-2B"
    temperature: 0.2
    max_tokens: 500
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.85
    max_batch_size: 4

# ============================================================
# Vision runtime
# ============================================================
vision:
  provider: "local"               # "local" | "openrouter" | "openai"
  extraction_mode: "preextract_unload"  # "preextract_unload" | "inline"
  unload_after_extraction: true
  final_rerank: false             # keep image use extraction-only by default
  model_name: "openai/gpt-5.4"    # used only when provider != local
  api_key_env: "OPENROUTER_API_KEY"
  api_base_url: "https://openrouter.ai/api/v1"
  timeout_seconds: 120

# ============================================================
# Normalization (Stage 2)
# ============================================================
normalization:
  embed_model: "FremyCompany/BioLORD-2023"
  similarity_threshold: 0.75

# ============================================================
# HPO expansion (Stage 2)
#
# "ic_gated" (default, recommended):
#   - low-IC patient terms expand downward + siblings (specific variants)
#   - medium-IC expand to children only
#   - high-IC no expansion
# "fixed_degree" (backward-compat):
#   - uses original degree_weights behavior from rare_dx_mcp
# ============================================================
expansion:
  mode: "ic_gated"                # "ic_gated" | "fixed_degree"
  max_expansion_depth: 1
  low_ic_threshold: 3.5            # IC < 3.5: expand children + siblings
  medium_ic_threshold: 5.0         # 3.5 <= IC < 5.0: expand children only; >=5 no expansion

# ============================================================
# Scoring (Stage 3)
# ============================================================
scoring:
  # Final production formula selected from the Stage 3 sweep.
  use_specific_signal: true       # high-IC hallmark match bonus
  use_incongruity_match: false    # diagnostic: useful to inspect, but over-amplified false positives in benchmarks
  use_cooccurrence_pairs: true    # rare phenotype-pair retrieval
  use_semantic_similarity: true   # HPO MICA best-match-average rescue signal
  use_phenotype_profile: true     # coverage-aware patient-profile rescue signal
  use_generic_guard: true         # downweights broad/generic HPO-only explanations
  use_anchor_cluster: true        # rewards coherent multi-feature high-IC support
  gene_evidence_policy: "negative_only"  # "negative_only" demotes only; "status_aware" restores positive/unknown bonuses

  # Base component weights.
  weights:
    phenotype: 2.0
    genotype: 3.0
    family_evidence: 1.0
    demographics: 1.0
    cases: 1.0
    specific_signal: 0.5
    incongruity_match: 0.0
    cooccurrence_pairs: 0.5
    semantic_similarity: 1.0
    phenotype_profile: 3.75
    generic_guard: 1.0
    anchor_cluster: 0.5

  # Bounded CPU-only phenotype similarity.
  semantic_similarity_max_disease_hpos: 80

  # Disease-size cap for phenotype_score normalization.
  phenotype_disease_size_norm_cap: 30

  # Minimum IC to treat a patient HPO as "high-IC" (used in specific_signal).
  # Uses an absolute threshold to avoid sparse frequency metadata suppressing the signal.
  ic_high_threshold: 5.0

# ============================================================
# Retrieval (Stage 3)
# ============================================================
retrieval:
  # Broad deterministic candidate pool before composite scoring.
  # This is cheap relative to LLM stages.
  initial_top_k: 5000

  # Number of Stage 3 scored candidates retained for downstream tables,
  # family-evidence shortlisting, and possible later rescue/debugging.
  retain_top_k: 500

# ============================================================
# Stage 3.5 case signal (non-gating; never changes ranking or execution)
# ============================================================
case_signal:
  enabled: true
  llm_interpretation: true
  high_ic_threshold: 6.0
  crowding_fraction: 0.95
  raw_top_reference: 8.0
  max_ic_reference: 10.0
  high_ic_count_reference: 3.0
  organ_system_reference: 8.0
  genetic_threshold: 75.0
  low_signal_threshold: 35.0
  high_signal_threshold: 75.0
  group_weights:
    score_shape: 0.30
    hpo_specificity: 0.65
    family_history: 0.05

# ============================================================
# Frontier consultation (Stage 4) — CONDITIONAL, at most 1 API call per patient
# ============================================================
# Master switch: frontier.enabled controls whether Stage 4 runs.
# provider: "local" routes through the same vLLM client (no API cost);
#           "openrouter", "vertexai", "openai" use the external API.
# Switching between them requires only changing this block.
# ============================================================
frontier:
  enabled:  true                  # master switch
  provider: "local"               # "local" | "openrouter" | "vertexai" | "openai"

  # When provider == "local": uses models.text_llm (same vLLM instance)
  # When provider != "local": uses this model via API
  model_name: "anthropic/claude-opus-4.6"

  # API settings (used when provider != "local")
  api_key_env: "OPENROUTER_API_KEY"   # env variable holding the API key
  api_base_url: "https://openrouter.ai/api/v1"
  temperature: 0.1
  max_tokens: 12000
  timeout_seconds: 120

  # How many top candidates to include in the frontier prompt
  top_n_candidates: 100

  # Trigger conditions — any true fires the call
  trigger:
    on_incongruity: true            # fire when incongruity strength >= moderate
    on_top5_ambiguity: true         # fire when top-5 score gap < 10%
    on_low_specific_signal: true    # fire when no top-20 has specific_signal > 0
    force_always: false             # override: always fire (for ablation)

# ============================================================
# Audit (Stage 5)
# ============================================================
audit:
  # Number of top post-Stage-3 candidates audited locally.
  # Kept separate from frontier.top_n_candidates so each can be tuned independently.
  top_n_candidates: 100
  use_narrative_excerpts: true    # include per-candidate narrative excerpts if KG has them
  skip_if_frontier_flagged: true  # skip audit only for frontier-underranked candidates

  multipliers:
    strong: 1.3
    moderate: 1.0
    weak: 0.7
    implausible: 0.3

# ============================================================
# Pairwise (Stage 6)
# ============================================================
pairwise:
  top_n: 30                       # candidates entering pairwise
  dynamic_top_n_enabled: true      # always include Top-30; optionally expand to Top-50
  dynamic_max_top_n: 50
  dynamic_sparse_hpo_threshold: 8
  dynamic_branch_concentration_threshold: 0.75
  dynamic_rank30_score_ratio_threshold: 0.70
  skip_large_gaps: true           # skip pairs with audit-category gap >= 2
  skip_score_gap_multiplier: 2.0  # skip if scoreA > scoreB * this
  adaptive_prompts: true          # fingerprint vs differential vs card-based
  bidirectional_swap: true        # swap test for frontier-flagged pairs
  use_audit_bullets: true         # forward audit evidence into pairwise
  overlap_threshold_high: 0.6     # Jaccard threshold for fingerprint-focused

# ============================================================
# Rank aggregation (Stage 7)
# ============================================================
rank_aggregation:
  damping: 0.85
  max_iter: 200
  tol: 1.0e-10
  close_margin: 0.01

# ============================================================
# Reconciliation (Stage 8)
# ============================================================
reconciliation:
  enabled: true
  alpha_gene_strong: 0.0          # when strong gene evidence exists
  alpha_group_hallmarks: 1.0      # when group hallmarks dominate
  alpha_default: 0.5
  tiebreaker_on_disagreement: true

# ============================================================
# Final ranking calibration (after Stage 8)
# ============================================================
final_ranking:
  enabled: true
  method: "score_fusion"
  original_weight: 0.65
  reconciled_weight: 0.35
  score_col_original: "total_score"
  score_col_reconciled: "reconciled_score"

# ============================================================
# External retrieval
# ============================================================
external:
  pubcase_finder:
    enabled: true
    max_results: 10

# ============================================================
# Genomics (VCF handling)
# ============================================================
genomics:
  vcf_analyzer: "auto"            # "auto" | "exomiser" | "rankvar"
  results_dir: ""                 # optional completed Exomiser/RankVar output dir
  trigger_if_missing: true        # records pending status unless an external runner is configured
  trigger_command: ""             # optional async command template; see scripts/run_pipeline.py

# ============================================================
# Stage 9 clinical synthesis (does not change Stages 1-8 or Stage 10)
# ============================================================
stage9:
  backend: "native"              # reuse the loaded pipeline vLLM engine
  # Optional alternative: backend="endpoint" for an existing vLLM HTTP server.
  base_url: "http://localhost:8000/v1"
  model_name: ""                 # inherit models.text_llm.model_name; no new model
  temperature: 0.1               # Stage 9 only; upstream sampling is unchanged
  max_batch_size: 14             # all ten candidate prompts in one native batch
  max_concurrency: 14            # concurrent calls in endpoint mode
  timeout_seconds: 300
  max_retries: 2                 # endpoint transport retries, not extra synthesis steps
  context_safety_margin: 64      # reserve room for chat-template/tokenization variance
  minimum_output_tokens: 256     # fail only if even a minimally useful answer cannot fit
  truncate_overlong_inputs: true # only when needed; raw note middle first, with an explicit marker
  preserve_requested_output_tokens: true # trim overlong input enough to retain the configured answer budget
  token_budgets:
    # Output limits. Full source evidence is retained unless the model context
    # cannot hold input + this output budget; such truncation is audited.
    patient_summary: 2000
    family_history: 1500
    candidate_top3: 2500
    candidate_4_to_7: 2000
    candidate_8_plus: 1500
    differential_synthesis: 1500
    next_steps: 2000

# ============================================================
# Pipeline / output
# ============================================================
output:
  scorecard_top_k: 10
  save_rank_trajectory: true
  save_scorecard_txt: true
  save_scorecard_json: true
  save_scorecard_pdf: true

# ============================================================
# Next-test and next-step recommendations (Stage 10)
# ============================================================
next_steps:
  enabled: true

  # Use disease groups represented within the global Top-10 final ranking.
  disease_top_k: 10

  # Return the ten actions supported by the most distinct disease groups.
  action_top_k: 10

  # RareGraph fields included in the production recommendation set.
  action_fields:
    - "testing"
    - "initial_evaluations"

  # Exact lexical normalization runs first. BioLORD then merges semantically
  # equivalent action labels at or above this cosine-similarity threshold.
  cluster_similarity_threshold: 0.90
